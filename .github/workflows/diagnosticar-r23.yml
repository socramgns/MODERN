  c953-offline-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c9537266d03535c305cb8e882c09be1a81376669
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --timeout 45 --retries 2 -r requirements-dev.txt
      - name: Compilar y comparar los bytes de AD
        run: |
          python tools/build.py
          cmp Analizador_YuGiOh.html dist/Calculadora_de_Barajas_YuGiOh_Alpha_1263_Corregida.html
      - name: Verificar el helper real de c953 sobre HTTPS y HTTP local
        run: |
          python - <<'PY'
          import hashlib, json, os, sys, traceback
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, str(Path('tests').resolve()))
          import browser_offline
          from browser_offline import new_offline_page
          helper_hash = hashlib.sha256(Path(browser_offline.__file__).read_bytes()).hexdigest()
          assert helper_hash == 'd8505a6c1ddfb170acc7a6b7c4641723a6681e816d0ea0b283b2d166b59da2f3'
          build = json.loads(Path('dist/build-manifest.json').read_text())
          document = Path(build['output']).read_bytes()
          digest = hashlib.sha256(document).hexdigest()
          assert build['buildId'] == 'ad379fc6b8cddeaff64a1895a2eb97fed493b037a7e725a3bd9681a185d94a64'
          assert digest == build['htmlSha256'] == '017f4cd81211d2be486c6634e876254fe6dc2225e6419c02e459d69ea7022c9e'
          output = Path('/tmp/c953-offline-boot'); output.mkdir(parents=True, exist_ok=True)
          rows = []
          with sync_playwright() as runtime:
              browser = runtime.chromium.launch(executable_path=runtime.chromium.executable_path, headless=True, args=['--no-sandbox'])
              try:
                  for name, target in [('HTTPS', 'https://ygo-release23.test/Analizador_YuGiOh.html'), ('HTTP127', 'http://127.0.0.1:8766/Calculadora_de_Barajas_YuGiOh_Alpha_1263_Corregida.html')]:
                      row = {'variant': name, 'target': target, 'pass': False, 'sourceCommit': 'c9537266d03535c305cb8e882c09be1a81376669', 'helperSha256': helper_hash, 'buildId': build['buildId'], 'htmlSha256': digest, 'engineVersion': browser.version, 'errors': [], 'pageErrors': [], 'blocked': []}
                      context = browser.new_context(viewport={'width': 1440, 'height': 1000})
                      try:
                          def deliver(route):
                              if route.request.url == target:
                                  route.fulfill(status=200, content_type='text/html; charset=utf-8', body=document)
                              else:
                                  row['blocked'].append(route.request.url); route.abort()
                          context.route('**/*', deliver)
                          page = new_offline_page(context)
                          page.on('pageerror', lambda error: row['pageErrors'].append(str(error)))
                          response = page.goto(target, wait_until='domcontentloaded', timeout=45000)
                          row['navigatorAfterGoto'] = page.evaluate('()=>navigator.onLine')
                          row['responseStatus'] = response.status if response else None
                          row['responseSha256'] = hashlib.sha256(response.body()).hexdigest() if response else None
                          row['documentBuildId'] = page.evaluate('()=>window.YGO_BUILD_MANIFEST?.buildId||null')
                          page.wait_for_function('()=>!!window.YGOAdvancedWorkbench&&!!window.YGODataCatalog', timeout=45000)
                          row['ready'] = page.evaluate('''async()=>await Promise.race([Promise.all([YGODataCatalog.ready,YGOAdvancedWorkbench.ready]).then(()=>true),new Promise(resolve=>setTimeout(()=>resolve(false),30000))])''')
                          row['navigatorAfterReady'] = page.evaluate('()=>navigator.onLine')
                          row['pass'] = row['navigatorAfterGoto'] is False and row['navigatorAfterReady'] is False and row['responseStatus'] == 200 and row['responseSha256'] == digest and row['documentBuildId'] == build['buildId'] and row['ready'] is True and not row['pageErrors']
                      except Exception:
                          row['errors'].append(traceback.format_exc())
                      finally:
                          try: context.close()
                          except Exception: row['errors'].append(traceback.format_exc())
                          row['pass'] = row['pass'] and not row['errors']
                          rows.append(row)
                          (output / 'results.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n')
                          compact = dict(row); compact['errors'] = [value[-1400:] for value in row['errors'][:1]]; compact['pageErrors'] = [value[-500:] for value in row['pageErrors'][:1]]
                          text = json.dumps(compact, ensure_ascii=False, separators=(',', ':')); assert len(text) <= 3900
                          print('R23_C953_BOOT_' + name + ' ' + text, flush=True)
                          print('::warning title=R23_C953_BOOT_' + name + '::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'), flush=True)
              finally: browser.close()
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('```json\n' + json.dumps(rows, ensure_ascii=False, indent=2) + '\n```\n')
          assert len(rows) == 2 and all(row['pass'] for row in rows), 'Actual c953 helper boot failed; inspect both raw results'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c953-offline-boot
          path: /tmp/c953-offline-boot/
          if-no-files-found: warn
          retention-days: 7
